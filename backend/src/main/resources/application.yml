server:
  port: 8080

spring:
  application:
    name: mail-client-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mail_client?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  jackson:
    default-property-inclusion: non_null

# 应用自定义配置
mail:
  app:
    jwt-secret: ${JWT_SECRET:mail-client-dev-secret-change-me-0123456789abcdef0123456789abcdef}
    jwt-expire-seconds: 3600
    master-key: ${MASTER_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    storage-mode: local            # local | minio
    ost-base-dir: ./data/ost
    attach-dir: ./data/attachments
    pst-export-dir: ./data/exports
    pst-max-import-mb: 100
    cors-allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: admin
      secret-key: admin123456
      bucket: mail-attachments

logging:
  level:
    com.mail: DEBUG
    org.springframework.security: WARN
